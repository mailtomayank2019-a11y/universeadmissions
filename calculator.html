<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online University Eligibility & Comparison Matrix</title>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --dark: #333; --light: #f8f9fa; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--light); color: var(--dark); padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        label { font-weight: 600; display: block; margin-bottom: 8px; }
        input, select, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #004085; }
        
        /* The Gated Lead Section */
        .modal { display: none; background: rgba(0,0,0,0.7); position: fixed; top:0; left:0; width:100%; height:100%; justify-content:center; align-items:center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 450px; width: 90%; text-align: center; }
        .modal h3 { color: var(--success); margin-top: 0; }
        
        /* Results Styling */
        #results { margin-top: 30px; display: none; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { border: 2px solid #e3e6f0; border-top: 5px solid var(--primary); padding: 20px; border-radius: 6px; background: white; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
        .price { font-size: 20px; font-weight: bold; color: var(--success); margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>UGC-Approved Online University Selector</h2>
    
    <div class="form-grid">
        <div>
            <label for="course">Target Program</label>
            <select id="course">
                <option value="MBA">Online MBA / PGDM</option>
                <option value="MCA">Online MCA</option>
            </select>
        </div>
        <div>
            <label for="percent">Graduation Marks (%)</label>
            <input type="number" id="percent" placeholder="e.g., 55" min="35" max="100">
        </div>
        <div>
            <label for="workexp">Work Experience (Months)</label>
            <input type="number" id="workexp" placeholder="e.g., 24" min="0">
        </div>
        <div style="display: flex; align-items: flex-end;">
            <button onclick="evaluateEligibility()">Find Eligible Universities</button>
        </div>
    </div>

    <div id="leadModal" class="modal">
        <div class="modal-content">
            <h3>Custom Match Report Ready!</h3>
            <p>We found matching UGC-DEB approved institutions for your profile. Enter your info to unlock the fee comparison matrix instantly.</p>
            <form id="leadForm" onsubmit="captureLead(event)">
                <input type="text" id="studentName" placeholder="Your Full Name" required style="margin-bottom: 15px;">
                <input type="tel" id="studentPhone" placeholder="WhatsApp Number (for report)" required style="margin-bottom: 15px;">
                <button type="submit">Unlock Report & Compare Fees</button>
            </form>
        </div>
    </div>

    <div id="results">
        <h3>Your Personalized Matches</h3>
        <div id="matrixContainer" class="grid-layout"></div>
    </div>
</div>

<script>
let database = [];
let qualifiedMatches = [];

// Pull universities data dynamically on page load
window.onload = async function() {
    try {
        const response = await fetch('./universities.json');
        database = await response.json();
    } catch (e) {
        console.error("Error loading institutional records", e);
    }
};

function evaluateEligibility() {
    const targetCourse = document.getElementById('course').value;
    const userPercent = parseFloat(document.getElementById('percent').value) || 0;
    const userExp = parseInt(document.getElementById('workexp').value) || 0;

    if(userPercent === 0) {
        alert("Please provide your Graduation marks percentage.");
        return;
    }

    // Filter institutional objects matching user metrics
    qualifiedMatches = database.filter(uni => {
        return uni.course === targetCourse && 
               userPercent >= uni.minGradPercent && 
               userExp >= uni.minWorkExpMonths;
    });

    // Fire the Lead Gate
    document.getElementById('leadModal').style.display = 'flex';
}

function captureLead(event) {
    event.preventDefault();
    
   function captureLead(event) {
    event.preventDefault();
    
    // 1. Gather the details the student typed into your calculator
    const name = document.getElementById('studentName').value;
    const phone = document.getElementById('studentPhone').value;
    const course = document.getElementById('course').value;
    const percent = document.getElementById('percent').value;

    // 2. Format a professional WhatsApp message text layout
    const message = `Hi Universe Admissions, I checked my eligibility on your portal.%0A%0A` +
                    `*Name:* ${encodeURIComponent(name)}%0A` +
                    `*Phone:* ${encodeURIComponent(phone)}%0A` +
                    `*Target Course:* ${encodeURIComponent(course)}%0A` +
                    `*Graduation Marks:* ${encodeURIComponent(percent)}%25`;

    // 3. Put your real mobile number below (Keep the 91 code, remove the plus sign)
    const yourWhatsAppNumber = "918595462696"; 

    // 4. Automatically open WhatsApp chat on their mobile or computer
    window.open(`https://api.whatsapp.com/send?phone=${yourWhatsAppNumber}&text=${message}`, '_blank');

    // 5. Unblock the screen to let them see the university matrix on your site
    document.getElementById('leadModal').style.display = 'none';
    renderMatrix();
}

function renderMatrix() {
    const container = document.getElementById('matrixContainer');
    container.innerHTML = '';

    if (qualifiedMatches.length === 0) {
        container.innerHTML = `<p>No exact algorithmic matches found for this specific score bracket. Contact our Delhi NCR desk for a manual admission exception review.</p>`;
    } else {
        qualifiedMatches.forEach(uni => {
            container.innerHTML += `
                <div class="card">
                    <h4>${uni.name}</h4>
                    <div class="price">₹${uni.feePerSemester.toLocaleString('en-IN')} <span style="font-size:12px; color:#666;">/ Sem</span></div>
                    <p><strong>Highlights:</strong> ${uni.highlights}</p>
                </div>
            `;
        });
    }

    document.getElementById('results').style.display = 'block';
}
</script>
</body>
</html>
